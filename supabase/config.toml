# Minimal local Supabase config: pinned values (some restate CLI defaults) (ADR-0011).
# Versioned source for the hosted auth and API settings: the owner applies it with
# `supabase config push` (Q4, decided). The repository never pushes it from CI. No secrets here.

project_id = "pactjoy"

[api]
# The `pactjoy` schema must never be exposed through the Data API (ADR-0010).
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
# Open signup is a product question (Q6); this flag is the single place to close it locally (true is the design default and the CLI default).
enable_signup = true

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 3600

# Placeholder template: the copy is not decided. It must carry {{ .Token }} (6-digit OTP).
[auth.email.template.magic_link]
subject = "Your PactJoy code"
content_path = "./supabase/templates/otp.html"

[functions.api]
# The gateway returns no envelope and no CORS headers on a 401, so the JWT is verified in code.
verify_jwt = false
import_map = "./functions/api/deno.json"
